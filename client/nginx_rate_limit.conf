# Nginx rate limiting zone definitions — included in the http{} block.
# This file is copied to /etc/nginx/conf.d/rate_limit.conf by the Dockerfile.
# The limit_req_zone directive must be in the http context (not server/location),
# which is satisfied by /etc/nginx/conf.d/ being auto-included by nginx.conf's http{}.

# Zone for CommuteFirst API: 100 req/min per IP (10MB shared memory for IP table)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
