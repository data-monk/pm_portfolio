# Rate limiting zones (defined at http context via include; when running inside a container
# with a minimal config, we define them here and rely on nginx including this file as the
# sole server block — the `limit_req_zone` directives must be in the `http` block, which
# is managed by the base nginx.conf that includes this file's parent directory.
# For Docker deployments, override /etc/nginx/nginx.conf to add these zones, or use
# the nginx.conf below that wraps everything in the required http block.)

# NOTE: In the Docker image this file is copied to /etc/nginx/conf.d/default.conf and
# nginx.conf already provides the http {} wrapper. The limit_req_zone directives below
# are placed in a separate snippet file; the Dockerfile must COPY both files.
# For simplicity in this monorepo setup, they are placed here as comments and applied
# via the Dockerfile's nginx.conf override shown in /api/Dockerfile.
#
# Effective rate limits (enforced at Nginx level):
#   - All API requests: 100 req/min per IP  (burst=20 nodelay)
#   - Search endpoint:  30 req/min per IP   (burst=10 nodelay)  ← matches slowapi
#   - Admin endpoint:   2 req/min per IP    (burst=2 nodelay)   ← matches slowapi

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy CommuteFirst API (must come before generic /api/ block)
    location /api/commute-search/ {
        proxy_pass         http://cs-api:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Rate limit: 100 req/min per IP across all commute-search API calls
        # (slowapi decorators enforce tighter per-endpoint limits inside FastAPI)
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
    }

    # Proxy API calls to the Node/Express backend
    location /api/ {
        proxy_pass         http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA fallback — all unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
